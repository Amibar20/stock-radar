# Daily scan: fetch prices, score, run the AI agents, update the track record, commit docs/data and deploy the site.
name: Daily scan

on:
  schedule:
    # GitHub may start scheduled runs hours late or drop them, especially on the hour, so each market has
    # an off-the-hour main run plus a backup run. A run that finds no new trading day exits in seconds
    # (1 Twelve Data credit for US), so the backup costs nothing when the main run already worked.
    # Israel (TASE). Mon-Thu close ~17:30 Israel time = 15:30 UTC (winter) / 14:30 UTC (summer).
    - cron: "23 17 * * 1-4"
    - cron: "47 19 * * 1-4"
    # Israel Friday close ~13:50 Israel time = 11:50 / 10:50 UTC.
    - cron: "23 13 * * 5"
    - cron: "47 15 * * 5"
    # US. Close 16:00 New York = 21:00 UTC (winter) / 20:00 UTC (summer). Backup early next UTC morning.
    - cron: "37 22 * * 1-5"
    - cron: "13 3 * * 2-6"
  workflow_dispatch:
    inputs:
      market:
        description: "Which market to scan"
        type: choice
        options: [both, us, il]
        default: both

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-radar-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick market
        id: pick
        run: |
          # The US runs also scan Israel first: if the Israel run was missed (GitHub skips scheduled runs now
          # and then), this fills it in; if Israel is already up to date it exits in seconds.
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            workflow_dispatch:*)          m="${{ inputs.market }}" ;;
            *:"37 22 * * 1-5"|*:"13 3 * * 2-6") m="both" ;;
            *)                            m="il" ;;
          esac
          if [ "$m" = "both" ]; then echo "markets=il us" >> "$GITHUB_OUTPUT"; else echo "markets=$m" >> "$GITHUB_OUTPUT"; fi

      - name: Refresh US universe (monthly)
        if: contains(steps.pick.outputs.markets, 'us')
        run: python -m scanner.universe --refresh-us --if-older-than-days 30

      - name: Scan
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          # One market failing must not stop the other (Israel runs first and uses the less reliable source).
          rc=0
          for m in ${{ steps.pick.outputs.markets }}; do
            python -m scanner.run --market "$m" || rc=1
          done
          exit $rc

      - name: Commit data
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          [ -d docs/data ] && git add docs/data
          git add data/universe_us.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: ${{ steps.pick.outputs.markets }} $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          exit 1

  # Deploy only when new data was pushed. GitHub needs a moment to register the uploaded artifact: deploying in
  # the same second fails with "No artifacts named github-pages were found". Wait first, and retry once.
  deploy:
    needs: scan
    if: ${{ !cancelled() && needs.scan.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - run: sleep 20
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
