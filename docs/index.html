<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stock Radar</title>
  <meta name="description" content="סורק מניות יומי: רעיונות מחקר בארה״ב ובישראל">
  <meta name="theme-color" content="#08090c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stock Radar">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* Apply the saved theme before the first paint (dark is the default). */
    try {
      var p = JSON.parse(localStorage.getItem("theme") || '"dark"');
      var t = p === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : p;
      document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
    } catch (e) { /* private mode: keep dark */ }
  </script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="30" height="30">
        <div>
          <div class="brand-name">Stock Radar</div>
          <div class="updated" id="updated" aria-live="polite"></div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" data-action="search" aria-label="חיפוש מניה">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        </button>
        <button class="icon-btn" data-action="tab" data-screen="settings" aria-label="הגדרות">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <section class="screen" id="screen-home" data-title="היום"></section>
    <section class="screen" id="screen-markets" data-title="שווקים" hidden></section>
    <section class="screen" id="screen-watch" data-title="הרשימה שלי" hidden></section>
    <section class="screen" id="screen-perf" data-title="ביצועים" hidden></section>
    <section class="screen" id="screen-settings" data-title="הגדרות" hidden></section>
    <footer class="disclaimer">כלי מחקר אישי, אינו ייעוץ השקעות. הנתונים מתעכבים ועלולים להיות שגויים.</footer>
  </main>

  <nav class="tabbar" aria-label="ניווט">
    <button class="tab active" data-action="tab" data-screen="home" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5L12 4.5l8.5 7"/><path d="M6 10v9.5h12V10"/></svg>
      <span>היום</span>
    </button>
    <button class="tab" data-action="tab" data-screen="markets">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16"/><path d="M5 15.5l4.5-5 3.5 3 6-7"/></svg>
      <span>שווקים</span>
    </button>
    <button class="tab" data-action="tab" data-screen="watch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.9l-5.3 2.7 1-5.8-4.2-4.1 5.9-.9z"/></svg>
      <span>הרשימה שלי</span>
    </button>
    <button class="tab" data-action="tab" data-screen="perf">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V13M10 20V8M15 20v-5M20 20V5"/></svg>
      <span>ביצועים</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" data-action="close" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-bar">
      <div class="sheet-grip" aria-hidden="true"></div>
      <button class="icon-btn sheet-close" data-action="close" aria-label="סגירה">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </div>
    <div id="sheet-body"></div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
