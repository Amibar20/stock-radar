<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stock Radar</title>
  <meta name="description" content="סורק מניות יומי: רעיונות מחקר בארה״ב ובישראל">
  <meta name="theme-color" content="#0d1b2a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stock Radar">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="screen-title">היום</h1>
    <div class="updated" id="updated" aria-live="polite"></div>
  </header>

  <main id="app" tabindex="-1">
    <section class="screen" id="screen-today" data-title="היום"></section>
    <section class="screen" id="screen-us" data-title="ארה״ב" hidden></section>
    <section class="screen" id="screen-il" data-title="ישראל" hidden></section>
    <section class="screen" id="screen-watch" data-title="מעקב" hidden></section>
    <footer class="disclaimer">כלי מחקר אישי, אינו ייעוץ השקעות. הנתונים מתעכבים ועלולים להיות שגויים.</footer>
  </main>

  <nav class="tabbar" aria-label="ניווט">
    <button class="tab active" data-screen="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 16 0 8 8 0 0 0-16 0m8-4v4l3 2"/></svg>
      <span>היום</span>
    </button>
    <button class="tab" data-screen="us">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 16l4-5 3 3 5-7"/></svg>
      <span>ארה״ב</span>
    </button>
    <button class="tab" data-screen="il">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.8 13.5H4.2zM12 21l-7.8-13.5h15.6z"/></svg>
      <span>ישראל</span>
    </button>
    <button class="tab" data-screen="watch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.9l-5.3 2.7 1-5.8-4.2-4.1 5.9-.9z"/></svg>
      <span>מעקב</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="sheet-close" id="sheet-close" aria-label="סגירה">✕</button>
    <div id="sheet-body"></div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
